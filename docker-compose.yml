services:
  postgres:
    image: postgres:16-alpine
    container_name: chatgpt-clone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatgpt_clone
      POSTGRES_PASSWORD: chatgpt_clone
      POSTGRES_DB: chatgpt_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatgpt_clone"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: a GUI for browsing the database. Start with:
  #   docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chatgpt-clone-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
